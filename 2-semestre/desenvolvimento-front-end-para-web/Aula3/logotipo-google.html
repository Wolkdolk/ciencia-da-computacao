<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logotipo</title>
</head>
<body>
    <h1>Exemplo do Logotipo com foto</h1>

    <figure
        style = 
        "
        text-align:center;
        margin: 0;
        font-family: Arial, sans-serif;
        transform: translateY(-20px);
        "
    >

        <img
            src="https://upload.wikimedia.org/wikipedia/commons/b/bf/Front-end-logo-color%402x.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
            alt="Logotipo do texto Front-End"
            width="280"
            style="
                border: 3px solid rgba(241, 187, 8, 0.933);
                border-radius: 12px;
                padding: 5px;
            "
        />

        <figcaption>
            Desenvolvimento Front-End para web
        </figcaption>

    </figure>

</body>
</html>
