<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
</head>
<body>
    <h1>Tabelas em HTML</h1>
    <p>
        As tabelas em HTML são usadas em linhas e colunas.
    </p>
    <table border = "1">
        <thead>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>        
        </thead>
        <tbody>
            <tr>
                <td>Ana</td>
                <td>25</td>
                <td>São Paulo</td>
            </tr>
            <tr>
                <td>Bruno</td>
                <td>30</td>
                <td>Rio de Janeiro</td>
            </tr>
        </tbody>
    </table>
    <br>
    <img src="img/tux.png" alt="Tux">
</body>
</html>
