<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de Lista</title>
</head>
<body>
    <h1>Elementos de Lista</h1>
    <p>
        As listas em HTML são utilizadas para organizar informações em uma sequência.
    </p>
    <h2>Listas Não Ordenadas</h2>
    <ul>
        <li>Item1</li>
        <li>Item2</li>
        <li>Item3</li>
        <li>Item4</li>
    </ul>
    <h2>Listas Ordenadas</h2>
    <ol>
        <li>Primeiro item</li>
        <li>Segundo item</li>
        <li>Terceiro item</li>
    </ol>
</body>
</html>
