<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomia das Tags para HTML</title>
</head>
<body>
    <h1>Anatomia das Tags</h1>
    <p>
        As tags em HTML são os elementos básicos que compõe uma página web. Cada tag tem uma estrutura específica e
        desempenha um papel importante na organização de apresentação de conteúdo.
    </p>
    <p>
        Este é um exemplo de parágrafo que pode ter <strong>texto em negrito</strong> ou <em>texto em itálico</em>.
    </p>
</body>
</html>
